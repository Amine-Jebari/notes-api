apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-notes-manager
  labels:
    app: notes-api
spec:
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    
    spec:
      containers:
        - name: fastapi-container
          image: notes-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet: 
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
        
          readinessProbe: 
            httpGet: 
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          envFrom:
            - configMapRef:
                name: notes-config

          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: notes-secrets
                  key: API_KEY

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi